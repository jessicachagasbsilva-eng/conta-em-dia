<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Conta em Dia: organize salário, contas e gastos e monte seu plano para sair das dívidas. Gratuito e privado: seus dados ficam no seu celular.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Conta em Dia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0B6646">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: app de uma coluna, cabeçalho verde com o saldo do mês, abas na base no celular e no topo no computador.
   Paleta "vitória": verde-esmeralda (conquista) + dourado (troféu) sobre fundo menta claro, cantos macios. */
:root{
  --bg:#F3FAF6; --surface:#FFFFFF; --ink:#16332A; --muted:#5D766E; --line:#E1EEE7;
  --accent:#138A5E; --accent-deep:#0B6646; --accent-soft:#E2F5EB; --accent-ink:#FFFFFF;
  --gold:#D9A21B; --gold-soft:#FFF5D9; --gold-ink:#7D5800;
  --good:#138A5E; --good-soft:#E2F5EB; --warn:#B26A00; --warn-soft:#FFF2DD; --bad:#C2452F; --bad-soft:#FDEDE8;
  --c1:#138A5E; --c2:#E39A2D; --c3:#D0614B; --c4:#4A86BE; --c5:#8466B5; --c6:#8A9A95;
  --shadow:0 1px 2px rgba(11,102,70,.05), 0 6px 18px rgba(11,102,70,.07);
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-bottom:88px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.08rem;font-weight:600;display:flex;align-items:center;gap:8px}
p{margin:0}
a{color:var(--accent-deep)}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ibox{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-deep);flex:none}
.ibox.gold{background:var(--gold-soft);color:var(--gold-ink)}.ibox.bad{background:var(--bad-soft);color:var(--bad)}.ibox.blue{background:#E6F0FA;color:#2F6A9E}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent-deep)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(120deg,var(--accent-deep),var(--accent));color:var(--accent-ink)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em}
.brand .logo{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;color:#FFD86B}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:.78rem;opacity:.9;letter-spacing:0}
.pill-sobra{background:rgba(255,255,255,.16);border-radius:16px;padding:6px 12px;font-size:.8rem;text-align:right;white-space:nowrap}
.pill-sobra b{font-size:1rem;display:block;font-variant-numeric:tabular-nums}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);box-shadow:0 -4px 18px rgba(11,102,70,.08);display:flex;justify-content:space-around;padding:6px max(6px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px, env(safe-area-inset-left,0px))}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.72rem;padding:6px 2px;border-radius:14px;min-width:0}
nav.tabs a .ic{width:24px;height:24px}
nav.tabs a.on{color:var(--accent-deep);background:var(--accent-soft);font-weight:700}
@media (min-width:760px){
  body{padding-bottom:28px}
  nav.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);bottom:auto;justify-content:center;gap:6px;box-shadow:0 4px 14px rgba(11,102,70,.06)}
  nav.tabs a{flex:0 0 auto;flex-direction:row;gap:6px;font-size:.92rem;padding:8px 14px}
  nav.tabs a .ic{width:20px;height:20px}
}
main{padding-block:20px 32px}
section.view{display:grid;gap:16px}
.head{display:grid;gap:6px}
.lead{color:var(--muted);max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:14px;min-width:0;box-shadow:var(--shadow)}
.card.soft{background:var(--accent-soft);border-color:transparent;box-shadow:none}
.card.gold{background:linear-gradient(160deg,#FFF9E8,#FFF1CC);border-color:#F3DFA6}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:4px;min-width:0;box-shadow:var(--shadow)}
.kpi .top{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.kpi .ibox{width:30px;height:30px;border-radius:10px}.kpi .ibox .ic{width:17px;height:17px}
.kpi b{font-family:var(--display);font-size:1.22rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi i{font-style:normal;font-size:.76rem;color:var(--muted)}
.status{border-radius:20px;padding:18px;display:grid;gap:6px;border:1px solid transparent}
.status.good{background:var(--good-soft);border-color:#C3E8D4}.status.warn{background:var(--warn-soft);border-color:#F6D9AE}.status.bad{background:var(--bad-soft);border-color:#F6CDC2}
.status .big{font-family:var(--display);font-weight:800;font-size:2rem;font-variant-numeric:tabular-nums}
.status.good .big{color:var(--good)}.status.warn .big{color:var(--warn)}.status.bad .big{color:var(--bad)}
.tag{display:inline-flex;align-items:center;gap:4px;width:max-content;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-deep)}
.tag .ic{width:13px;height:13px}
.tag.good{background:var(--good-soft);color:var(--good)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.gold{background:var(--gold-soft);color:var(--gold-ink)}.tag.gray{background:#EEF2F0;color:var(--muted)}
label{display:grid;gap:4px;font-weight:700;font-size:.92rem;min-width:0}
label small{font-weight:400;color:var(--muted);font-size:.8rem}
label.check{grid-template-columns:auto 1fr;align-items:center;gap:10px;font-weight:400}
label.check input{width:20px;height:20px;accent-color:var(--accent)}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:14px;background:#FBFDFC;color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid #9FDCC0;outline-offset:1px;border-color:var(--accent)}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:11px 16px;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center}
button:hover,.btn:hover{filter:brightness(1.05)}
button.ghost{background:var(--surface);color:var(--accent-deep);border:1.5px solid #A8D9C2}
button.light,.btn.light{background:var(--accent-soft);color:var(--accent-deep)}
button.gold{background:var(--gold);color:#2E2200}
button.danger{background:var(--bad-soft);color:var(--bad)}
button.sm{padding:7px 11px;font-size:.85rem;border-radius:11px}
button.x{background:transparent;color:var(--muted);padding:6px}
button.x:hover{color:var(--bad)}
.seg{display:inline-flex;background:var(--accent-soft);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{background:transparent;color:var(--accent-deep);padding:8px 12px;font-weight:700;border-radius:11px}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:16px;background:#FAFCFB;border:1px solid var(--line)}
.item .t{min-width:0}.item .t b{display:block;overflow-wrap:anywhere}.item .t small{color:var(--muted);display:block}
.item .end{display:grid;justify-items:end;gap:4px}
.item .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.item.paid{background:var(--good-soft);border-color:#C3E8D4}
.item.late{background:var(--bad-soft);border-color:#F6CDC2}
.pay{grid-column:1/-1;display:grid;gap:10px;background:var(--surface);border-radius:14px;padding:12px;border:1px dashed #A8D9C2}
.money{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.neg{color:var(--bad)}.pos{color:var(--good)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:9px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
tr.total td{font-weight:800;border-bottom:0;border-top:2px solid var(--accent)}
.tbl{overflow-x:auto}
.explain{font-size:.88rem;color:var(--muted)}
details{border:1px solid var(--line);border-radius:16px;padding:11px 14px;background:var(--surface)}
details summary{cursor:pointer;font-weight:700}
details[open] summary{margin-bottom:10px}
details p+p{margin-top:8px}
.banner{background:var(--gold-soft);border:1px solid #F3DFA6;border-radius:18px;padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.steps{counter-reset:s;display:grid;gap:10px;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);display:grid;place-items:center;font-weight:800;font-family:var(--display)}
.steps li.done::before{content:"✓";background:var(--accent);color:#fff}
.steps a{font-weight:700}
/* jornada */
.journey{display:grid;gap:12px}
.journey .pct{font-family:var(--display);font-weight:800;font-size:2.4rem;color:var(--gold-ink);line-height:1}
.track{position:relative;height:16px;border-radius:8px;background:#F3E6C0}
.track i{position:absolute;inset:0 auto 0 0;border-radius:8px;background:linear-gradient(90deg,var(--accent),#3DB37F)}
.marks{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:.74rem;color:var(--muted);text-align:center}
.marks span{display:grid;justify-items:center;gap:2px}
.marks .ic{width:18px;height:18px}
.marks .on{color:var(--gold-ink);font-weight:700}
.trophies{display:flex;flex-wrap:wrap;gap:8px}
.trophy{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid #F3DFA6;border-radius:999px;padding:5px 12px 5px 6px;font-size:.85rem;font-weight:700;color:var(--gold-ink)}
.trophy .ibox{width:26px;height:26px;border-radius:50%}.trophy .ibox .ic{width:15px;height:15px}
/* gráficos */
.donut-wrap{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
@media (max-width:420px){.donut-wrap{grid-template-columns:1fr;justify-items:center}}
.donut{width:150px;height:150px;border-radius:50%;position:relative}
.donut::after{content:"";position:absolute;inset:24px;border-radius:50%;background:var(--surface);z-index:0}
.donut span{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:2;text-align:center;font-size:.76rem;color:var(--muted);line-height:1.2}
.donut span b{display:block;color:var(--ink);font-family:var(--display);font-size:.92rem}
.legend{display:grid;gap:7px;width:100%}
.legend div{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;font-size:.92rem}
.legend i{width:12px;height:12px;border-radius:50%}
.bars{display:grid;gap:12px}
.bar{display:grid;gap:5px}
.bar .lbl{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;align-items:center}
.bar .lbl span:first-child{display:flex;align-items:center;gap:6px}
.bar .lbl .ic{width:16px;height:16px;color:var(--muted)}
.bar .trk{height:10px;background:#EEF4F1;border-radius:6px;overflow:hidden}
.bar .fill{height:100%;border-radius:6px;background:var(--accent)}
.meter{height:12px;border-radius:7px;background:#EEF4F1;position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:7px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11.5px;font-family:var(--body)}
.drop{border:2px dashed #A8D9C2;border-radius:18px;padding:18px;text-align:center;display:grid;gap:8px;justify-items:center;background:#F7FCF9}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--accent-deep);color:#fff;padding:10px 16px;border-radius:14px;z-index:20;font-weight:700;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.hint{font-size:.86rem;background:var(--accent-soft);border-radius:14px;padding:10px 13px}
.hint.gold{background:var(--gold-soft)}
.empty{color:var(--muted);text-align:center;padding:18px;border:1.5px dashed var(--line);border-radius:16px}
/* comemoração */
.party{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(11,51,38,.45);padding:24px}
.party .box{background:var(--surface);border-radius:26px;padding:28px 22px;max-width:360px;width:100%;text-align:center;display:grid;gap:10px;justify-items:center;position:relative;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.party .cup{width:84px;height:84px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center}
.party .cup .ic{width:48px;height:48px;stroke-width:1.6}
.party h2{color:var(--accent-deep)}
.conf{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;opacity:.9}
@media (prefers-reduced-motion:no-preference){
  .fill,.meter i,.track i{transition:width .5s ease}
  .conf{animation:cai 2.2s ease-in forwards}
  .party .cup{animation:pula .6s ease-out}
}
@keyframes cai{to{transform:translateY(420px) rotate(540deg);opacity:0}}
@keyframes pula{0%{transform:scale(.4)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
</style>
</head>

<script>
// ===== Cálculos (tabelas 2026) =====
const T = {
  inss: [ [1621.00, .075], [2902.84, .09], [4354.27, .12], [8475.55, .14] ],
  irrf: [ [2428.80, 0, 0], [2826.65, .075, 182.16], [3751.05, .15, 394.16], [4664.68, .225, 675.49], [Infinity, .275, 908.73] ],
  dep: 189.59, simplificado: 607.20,
  salMin: 1621.00
};
function calcINSS(base){
  let total = 0, prev = 0; const faixas = [];
  for (const [lim, a] of T.inss){
    if (base <= prev) break;
    const parte = Math.min(base, lim) - prev;
    if (parte > 0){ total += parte * a; faixas.push({de: prev, ate: Math.min(base, lim), aliq: a, valor: parte * a}); }
    prev = lim;
  }
  return { total: r2(total), faixas, teto: base > T.inss[T.inss.length-1][0] };
}
function calcIRRF(bruto, inss, deps, pensao){
  const dedLegal = inss + deps * T.dep + pensao;
  const usaSimpl = T.simplificado > (inss + deps * T.dep);
  const deducao = usaSimpl ? T.simplificado + pensao : dedLegal;
  const base = Math.max(0, bruto - deducao);
  let f = T.irrf.find(x => base <= x[0]);
  const imposto = Math.max(0, base * f[1] - f[2]);
  let redutor = 0;
  if (bruto <= 5000) redutor = Math.min(imposto, 312.89);
  else if (bruto <= 7350) redutor = Math.min(imposto, Math.max(0, 978.62 - 0.133145 * bruto));
  return { base: r2(base), aliq: f[1], imposto: r2(imposto), redutor: r2(redutor), total: r2(Math.max(0, imposto - redutor)), usaSimpl, deducao: r2(deducao) };
}
function calcFolha(s){
  const n = k => +s[k] || 0;
  const bruto = n('salario') + n('extras');
  const inss = calcINSS(bruto);
  const ir = calcIRRF(bruto, inss.total, n('dependentes'), n('pensao'));
  const vtCusto = n('vtCusto');
  const vt = vtCusto > 0 ? r2(Math.min(n('salario') * 0.06, vtCusto)) : 0;
  const descontos = [
    { nome: 'INSS (previdência)', valor: inss.total, tipo: 'imposto' },
    { nome: 'Imposto de Renda (IRRF)', valor: ir.total, tipo: 'imposto' },
    { nome: 'Vale-transporte (até 6%)', valor: vt, tipo: 'beneficio' },
    { nome: 'Vale-refeição / alimentação', valor: n('vrDesc'), tipo: 'beneficio' },
    { nome: 'Plano de saúde / odonto', valor: n('saude'), tipo: 'beneficio' },
    { nome: 'Pensão alimentícia', valor: n('pensao'), tipo: 'outro' },
    { nome: 'Empréstimo consignado', valor: n('consignado'), tipo: 'divida' },
    { nome: 'Outros descontos', valor: n('outros'), tipo: 'outro' },
  ].filter(d => d.valor > 0 || d.tipo === 'imposto');
  const totalDesc = r2(descontos.reduce((a, d) => a + d.valor, 0));
  const liquido = r2(bruto - totalDesc);
  return {
    bruto: r2(bruto), inss, ir, vt, descontos, totalDesc, liquido,
    fgts: r2(bruto * 0.08),
    beneficios: r2(n('vrValor') + vtCusto),
    decimo: r2(liquido),
    ferias: r2(n('salario') * 4/3),
    margemConsig: r2((bruto - inss.total - ir.total) * 0.35)
  };
}
function r2(x){ return Math.round(x * 100) / 100; }

// ===== Plano de dívidas =====
// d.fixa = parcelamento com valor fechado (juros já embutidos): paga só a parcela até acabar.
function planoDividas(dividas, orcamento, estrategia){
  let ds = dividas.filter(d => (+d.saldo) > 0.005).map(d => ({ ...d, saldo: +d.saldo, juros: d.fixa ? 0 : (+d.juros || 0) / 100, minimo: +d.minimo || 0, quitadaEm: null, jurosPagos: 0 }));
  if (!ds.length) return { meses: 0, juros: 0, serie: [0], ordem: [], ok: true, ds: [] };
  const ordenar = () => ds.filter(d => d.saldo > 0.005 && !d.fixa).sort((a, b) => estrategia === 'bola' ? a.saldo - b.saldo : b.juros - a.juros || a.saldo - b.saldo);
  const ordem = ordenar().map(d => d.nome);
  const serie = [r2(ds.reduce((a, d) => a + d.saldo, 0))];
  let mes = 0, juros = 0, travou = 0;
  while (ds.some(d => d.saldo > 0.005) && mes < 600){
    mes++;
    for (const d of ds) if (d.saldo > 0.005){ const j = d.saldo * d.juros; d.saldo += j; d.jurosPagos += j; juros += j; }
    let disp = orcamento;
    for (const d of [...ds].sort((a, b) => (b.fixa ? 1 : 0) - (a.fixa ? 1 : 0))) if (d.saldo > 0.005){ const p = Math.min(d.minimo, d.saldo, disp); d.saldo -= p; disp -= p; }
    for (const d of ordenar()){ if (disp <= 0) break; const p = Math.min(d.saldo, disp); d.saldo -= p; disp -= p; }
    for (const d of ds) if (d.saldo <= 0.005 && d.quitadaEm === null){ d.saldo = 0; d.quitadaEm = mes; }
    serie.push(r2(ds.reduce((a, d) => a + d.saldo, 0)));
    const varia = ds.filter(d => !d.fixa).reduce((a, d) => a + d.saldo, 0);
    if (varia > 0.005 && mes > 2 && ds.filter(d => !d.fixa).every(d => d.saldo === 0 || d.jurosPagos > 0) && ds.filter(d => d.fixa && d.saldo > 0.005).length === 0 && serie[mes] >= serie[mes - 1]) travou++;
    if (travou > 2) return { ok: false, meses: Infinity, juros, serie, ordem, ds };
  }
  return { ok: mes < 600, meses: mes, juros: r2(juros), serie, ordem, ds };
}

// ===== Leitura do holerite =====
const MONEY = /\d{1,3}(?:\.\d{3})*,\d{2}|\d+,\d{2}/g;
const toNum = s => +s.replace(/\./g, '').replace(',', '.');
function lerHolerite(texto){
  const linhas = texto.split(/\n/).map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const achado = {};
  const regras = [
    ['liquido', /l[ií]quido/i, null],
    ['totalProventos', /total\s*(de\s*)?(proventos|vencimentos)/i, null],
    ['fgts', /fgts/i, /base|sal\.?\s*contr/i],
    ['inss', /\binss\b|previd[eê]ncia/i, /base|sal\.?\s*contr|b\.?\s*c[aá]lc/i],
    ['irrf', /irrf|i\.r\.r\.f|imp(osto)?\.?\s*(de\s*)?renda|\bir\b/i, /base|b\.?\s*c[aá]lc/i],
    ['vt', /transporte|\bv\.?\s?t\b/i, null],
    ['vrDesc', /refei[cç]|aliment|\bv\.?\s?[ra]\b|ticket/i, null],
    ['saude', /sa[uú]de|m[eé]dic|odonto|unimed|amil|bradesco\s*sa/i, null],
    ['consignado', /consign|empr[eé]st/i, null],
    ['pensao', /pens[aã]o/i, null],
    ['extras', /hora.*extra|h\.?\s*extra|adicional|dsr|comiss/i, null],
    ['salario', /sal[aá]rio(?!\s*fam)|venc(imento)?\.?\s*base|horas?\s*normais|dias?\s*normais/i, /base\s*(c[aá]lc|inss|fgts|irrf)|contr/i],
  ];
  for (const l of linhas){
    const vals = l.match(MONEY); if (!vals) continue;
    for (const [k, re, nao] of regras){
      if (re.test(l) && !(nao && nao.test(l))){
        // valor do item: em holerites a referência (%/horas) vem antes; o valor é o último número
        const v = toNum(vals[vals.length - 1]);
        if (k === 'extras') achado[k] = r2((achado[k] || 0) + v);
        else if (achado[k] === undefined) achado[k] = v;
        break;
      }
    }
  }
  return achado;
}

<script>
// ===== Estado =====
const KEY = 'conta-em-dia-v1';

const somaMes = (m, k) => { const [a, b] = m.split('-').map(Number); const d = new Date(a, b - 1 + k, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const difMes = (a, b) => { const [y1, m1] = a.split('-').map(Number), [y2, m2] = b.split('-').map(Number); return (y2 - y1) * 12 + (m2 - m1); };

    { id: 2, tipo: 'parcelada', nome: 'Empréstimo pessoal', parcelas: 24, valorParcela: 310, inicio: somaMes(mesAtual, -10), folha: false },

  ],
  plano: { estrategia: 'avalanche', orcamento: 0 },
};
const VAZIO = { exemplo: false, uf: '', mes: mesAtual, folha: { salario: 0, extras: 0, dependentes: 0, vtCusto: 0, vrValor: 0, vrDesc: 0, saude: 0, pensao: 0, consignado: 0, outros: 0 }, rendas: [], fixas: [], pagos: {}, gastos: [], dividas: [], plano: { estrategia: 'avalanche', orcamento: 0 } };
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
S = S && S.folha ? { ...structuredClone(VAZIO), ...S } : structuredClone(EXEMPLO);
function salvar(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} atualizarTopo(); }
const uid = () => Date.now() + Math.floor(Math.random() * 1000);

// ===== Utilidades =====
const brl = v => (v < 0 ? '−' : '') + 'R$ ' + Math.abs(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = v => (v * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { if (typeof v === 'number') return v; const s = String(v || '').replace(/[R$\s]/g, ''); if (!s) return 0; return +(s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : s) || 0; };
const vf = v => v ? String(Math.round(v * 100) / 100).replace('.', ',') : '';
const $ = s => document.querySelector(s);
const ic = (n, cls = '') => `<svg class="ic ${cls}"><use href="#${n}"/></svg>`;
const catIc = c => ic('c-' + (CATS.includes(c) ? c : 'Outros'));
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }
const CATS = ['Moradia', 'Alimentação', 'Transporte', 'Saúde', 'Educação', 'Contas', 'Lazer', 'Filhos', 'Compras', 'Outros'];
const CORES = ['#138A5E', '#E39A2D', '#4A86BE', '#D0614B', '#8466B5', '#2EA58C', '#C2577A', '#9C7A3C', '#5D766E', '#A0ACA8'];
const corCat = c => CORES[Math.max(0, CATS.indexOf(c)) % CORES.length];
const nomeMes = m => { const [a, b] = m.split('-'); return new Date(+a, +b - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }); };
const curtoMes = m => { const [a, b] = m.split('-'); return new Date(+a, +b - 1, 1).toLocaleDateString('pt-BR', { month: 'short', year: '2-digit' }).replace('.', ''); };
function comemorar(titulo, texto){
  const cores = ['#138A5E', '#D9A21B', '#3DB37F', '#FFD86B', '#4A86BE'];
  const conf = Array.from({ length: 36 }, (_, i) => `<i class="conf" style="left:${Math.random() * 100}%;background:${cores[i % 5]};animation-delay:${Math.random() * .5}s"></i>`).join('');

  p.hidden = false;
}

// ===== Dívidas: estado no mês =====
function estadoDivida(d, mes = mesAtual){
  if (d.tipo === 'parcelada'){
    const total = +d.parcelas || 0, parc = num(d.valorParcela), ini = d.inicio || mesAtual;
    const pagas = d.quitada ? total : Math.min(total, Math.max(0, difMes(ini, mes)));
    const restantes = total - pagas;
    const idx = difMes(ini, mes);
    return { saldo: restantes * parc, inicial: total * parc, minimo: parc, fixa: true, pagas, restantes, total, ativa: !d.quitada && idx >= 0 && idx < total, fim: somaMes(ini, total - 1) };
  }
  const saldo = d.quitada ? 0 : num(d.saldo);
  return { saldo, inicial: Math.max(num(d.saldoInicial) || 0, num(d.saldo)), minimo: num(d.minimo), fixa: false, ativa: saldo > 0 };
}

// ===== Resumo =====
function pagoDe(id, mes = S.mes){ return (S.pagos[mes] || {})[id]; }
function resumo(){
  const f = calcFolha(S.folha);
  const rendaExtra = S.rendas.reduce((a, r) => a + num(r.valor), 0);
  const renda = f.liquido + rendaExtra;
  let fixas = 0, jurosAtraso = 0;
  S.fixas.forEach(x => { const p = pagoDe(x.id); const v = p ? num(p.valor) : num(x.valor); fixas += v; if (p && p.atraso) jurosAtraso += Math.max(0, num(p.valor) - num(x.valor)); });
  const gMes = S.gastos.filter(g => g.data.startsWith(S.mes));
  const gastos = gMes.reduce((a, g) => a + num(g.valor), 0);
  gMes.forEach(g => { if (g.atraso && g.original) jurosAtraso += Math.max(0, num(g.valor) - num(g.original)); });
  let parcelas = 0;
  S.dividas.forEach(d => { if (d.folha) return; const e = estadoDivida(d, S.mes); if (e.ativa) parcelas += e.fixa ? e.minimo : Math.min(e.minimo, e.saldo); });
  const parcelasFolha = num(S.folha.consignado);
  const sobra = renda - fixas - gastos - parcelas;
  let totalDivida = 0, totalInicial = 0, quitadas = 0;
  S.dividas.forEach(d => { const e = estadoDivida(d); totalDivida += e.saldo; totalInicial += e.inicial; if (d.quitada || e.saldo <= 0.005) quitadas++; });
  const progresso = totalInicial > 0 ? Math.max(0, Math.min(1, 1 - totalDivida / totalInicial)) : 0;
  const comprometido = renda > 0 ? (parcelas + parcelasFolha) / (renda + parcelasFolha) : 0;
  return { f, rendaExtra, renda, fixas, gastos, parcelas, parcelasFolha, sobra, totalDivida, totalInicial, progresso, quitadas, comprometido, jurosAtraso };
}
function atualizarTopo(){ const r = resumo(); $('#topSobra').innerHTML = 'Sobra do mês<b>' + brl(r.sobra) + '</b>'; }

function donut(partes, centro){
  const total = partes.reduce((a, p) => a + Math.max(0, p.v), 0) || 1;
  let acc = 0; const stops = partes.filter(p => p.v > 0).map(p => { const a = acc / total * 360; acc += p.v; return `${p.c} ${a}deg ${acc / total * 360}deg`; });
  return `<div class="donut-wrap"><div class="donut" style="background:conic-gradient(${stops.join(',') || '#EEF4F1 0 360deg'})" role="img" aria-label="Gráfico de rosca">${centro ? `<span>${centro}</span>` : ''}</div>
  <div class="legend">${partes.map(p => `<div><i style="background:${p.c}"></i><span>${esc(p.n)}</span><span class="money">${brl(p.v)} <small class="muted">${pct(Math.max(0, p.v) / total)}</small></span></div>`).join('')}</div></div>`;
}
function barras(itens){
  const max = Math.max(...itens.map(i => i.v), 1);
  return `<div class="bars">${itens.map(i => `<div class="bar"><div class="lbl"><span>${i.icon || ''}${esc(i.n)}</span><span class="money">${brl(i.v)}</span></div><div class="trk"><div class="fill" style="width:${i.v / max * 100}%;background:${i.c || 'var(--accent)'}"></div></div></div>`).join('')}</div>`;
}
const kpi = (icon, cor, rot, val, sub) => `<div class="kpi"><div class="top"><span class="ibox ${cor}">${ic(icon)}</span>${rot}</div><b>${val}</b><i>${sub}</i></div>`;

// ===== Telas =====
const V = {};
V.inicio = () => {
  const r = resumo();

  const passos = [
    ['regiao', 'Escolha seu estado', !!S.uf],
    ['salario', 'Informe seu salário ou carregue o holerite', num(S.folha.salario) > 0 && !S.exemplo],
    ['gastos', 'Liste suas contas fixas e anote os gastos do dia', S.fixas.length > 0 && !S.exemplo],
    ['dividas', 'Cadastre suas dívidas e veja o plano para quitar', S.dividas.length > 0 && !S.exemplo],
  ];

  const compNivel = comp > 0.3 ? 'bad' : comp > 0.2 ? 'warn' : 'good';
  const dicas = [];
  const cara = S.dividas.find(d => d.tipo !== 'parcelada' && !d.quitada && num(d.juros) >= 8 && num(d.saldo) > 0);

// ===== Holerite =====
async function carregaWorker(){
  if (window.pdfjsWorker) return;
  await new Promise((ok, err) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; s.onload = ok; s.onerror = () => err(new Error('não consegui carregar o leitor de PDF.')); document.head.appendChild(s); });
}
async function lerPDF(file){
  if (!file) return;
  const out = $('#holRes'); out.innerHTML = '<p class="hint">Lendo o holerite…</p>';
  try {
    if (!window.pdfjsLib) throw new Error('o leitor de PDF não carregou. Verifique a internet.');
    await carregaWorker();
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer(), isEvalSupported: false }).promise;
    let texto = '';
    for (let p = 1; p <= Math.min(pdf.numPages, 3); p++){
      const c = await (await pdf.getPage(p)).getTextContent();
      const linhas = {};
      for (const it of c.items){ const y = Math.round(it.transform[5] / 3); (linhas[y] = linhas[y] || []).push(it); }
      texto += Object.keys(linhas).sort((a, b) => b - a).map(y => linhas[y].sort((a, b) => a.transform[4] - b.transform[4]).map(i => i.str).join(' ')).join('\n') + '\n';
    }
    if (!texto.replace(/\s/g, '')) throw new Error('este PDF é uma imagem escaneada. Use a opção de colar o texto.');
    processarTexto(texto);
  } catch (e) { out.innerHTML = `<p class="hint">Não deu para ler: ${esc(e.message)} Você pode preencher os campos manualmente.</p>`; }
}
let ACHADO = {};
function processarTexto(t){
  ACHADO = lerHolerite(t || '');
  const nomes = { salario: 'Salário base', extras: 'Horas extras / adicionais', inss: 'INSS descontado', irrf: 'IRRF descontado', vt: 'Vale-transporte descontado', vrDesc: 'VR/VA descontado', saude: 'Plano de saúde', consignado: 'Consignado', pensao: 'Pensão', fgts: 'FGTS do mês', totalProventos: 'Total de proventos', liquido: 'Líquido a receber' };
  const ks = Object.keys(nomes).filter(k => ACHADO[k] !== undefined);
  const out = $('#holRes');
  if (!ks.length){ out.innerHTML = '<p class="hint">Não encontramos valores conhecidos. Preencha os campos abaixo manualmente.</p>'; return; }
  out.innerHTML = `<div class="card soft"><h3>Confira o que encontramos</h3><p class="explain">Corrija se algum valor estiver errado e toque em "Usar estes valores".</p>
  <div class="fields">${ks.map(k => `<label for="h_${k}">${nomes[k]}<input id="h_${k}" inputmode="decimal" value="${vf(ACHADO[k])}" oninput="ACHADO.${k}=num(this.value)"></label>`).join('')}</div>
  <button onclick="usarHolerite()">${ic('i-check')}Usar estes valores</button></div>`;
}
function usarHolerite(){
  const a = ACHADO, F = S.folha;
  if (a.salario) F.salario = a.salario;
  F.extras = a.extras || 0;
  if (a.vt) F.vtCusto = Math.max(F.vtCusto || 0, a.vt);
  ['vrDesc', 'saude', 'consignado', 'pensao'].forEach(k => { if (a[k] !== undefined) F[k] = a[k]; });
  S.exemplo = false; salvar();
  const f = calcFolha(F);
  let aviso = '';
  if (a.inss && Math.abs(a.inss - f.inss.total) > 5) aviso += `<li>O INSS do holerite (${brl(a.inss)}) é diferente do nosso cálculo (${brl(f.inss.total)}). Pode ser holerite de outro ano, faltas ou adicionais. Vale conferir com o RH.</li>`;
  if (a.irrf !== undefined && Math.abs(a.irrf - f.ir.total) > 5) aviso += `<li>O IR do holerite (${brl(a.irrf)}) é diferente do nosso cálculo (${brl(f.ir.total)}). Confira dependentes e pensão; se a diferença continuar, pergunte ao RH.</li>`;
  if (a.liquido && Math.abs(a.liquido - f.liquido) > 5) aviso += `<li>Seu líquido no holerite é ${brl(a.liquido)}. Se houver outro desconto que não apareceu, coloque em "Outros descontos".</li>`;
  render();
  if (aviso) $('#holRes').innerHTML = `<div class="hint gold"><b>Valores aplicados.</b> Fique de olho:<ul style="margin:6px 0 0;padding-left:20px">${aviso}</ul></div>`;
  toast('Holerite aplicado');
}

// ===== Gastos e contas =====
let abrePag = null;
function itemFixa(x){
  const p = pagoDe(x.id);
  const atrasada = !p && S.mes === mesAtual && x.dia && x.dia < hoje.getDate();
  const vencida = !p && difMes(S.mes, mesAtual) > 0;

  else st = `<span class="tag gray">${x.dia ? 'vence dia ' + x.dia : 'a pagar'}</span>`;

      <label for="pv_${x.id}">Valor pago (R$)<small>${atrasada || vencida ? 'Coloque o valor que você pagou, já com juros e multa.' : 'Valor pago.'}</small><input id="pv_${x.id}" name="valor" inputmode="decimal" value="${vf(num(x.valor))}"></label>
      <div class="row"><button type="submit">${ic('i-check')}Confirmar pagamento</button><button type="button" class="ghost" onclick="abrePag=null;render()">Cancelar</button></div></form>` : '';
  return `<div class="item ${cls}"><span class="ibox" style="background:${corCat(x.cat)}22;color:${corCat(x.cat)}">${catIc(x.cat)}</span><div class="t"><b>${esc(x.nome)}</b><small>${esc(x.cat)}${x.dia ? ' · dia ' + x.dia : ''}</small></div>
    <div class="end"><span class="money">${brl(p ? num(p.valor) : num(x.valor))}</span>${st}</div>

}
function pagarFixa(id, f){ const d = form(f); (S.pagos[S.mes] = S.pagos[S.mes] || {})[id] = { valor: num(d.valor), atraso: !!d.atraso }; abrePag = null; S.exemplo = false; salvar(); render(); const fx = S.fixas.find(x => x.id === id); const extra = num(d.valor) - num(fx.valor); toast(d.atraso && extra > 0 ? `Paga. Atraso custou ${brl(extra)}` : 'Conta paga. Mais uma!'); }
function desfazPag(id){ if (S.pagos[S.mes]) delete S.pagos[S.mes][id]; salvar(); render(); }

V.gastos = () => {
  const doMes = S.gastos.filter(g => g.data.startsWith(S.mes)).sort((a, b) => b.data.localeCompare(a.data));
  const porCat = {};
  S.fixas.forEach(x => { const p = pagoDe(x.id); porCat[x.cat] = (porCat[x.cat] || 0) + (p ? num(p.valor) : num(x.valor)); });
  doMes.forEach(g => porCat[g.cat] = (porCat[g.cat] || 0) + num(g.valor));
  const cats = Object.entries(porCat).sort((a, b) => b[1] - a[1]).map(([n, v]) => ({ n, v, c: corCat(n), icon: catIc(n) }));
  const catOpts = sel => CATS.map(c => `<option ${c === sel ? 'selected' : ''}>${c}</option>`).join('');
  const r = resumo();
  const dias = new Date(+S.mes.slice(0, 4), +S.mes.slice(5), 0).getDate();
  const dispDia = (r.renda - r.fixas - r.parcelas) / dias;
  const passados = S.mes === mesAtual ? hoje.getDate() : dias;
  const mediaDia = r.gastos / Math.max(1, passados);
  const pagas = S.fixas.filter(x => pagoDe(x.id)).length;
  return `
  <div class="head"><h2>Contas e gastos</h2><p class="lead">Contas fixas se repetem todo mês. Gastos do dia são as compras do dia a dia. Anotar tudo é o primeiro passo para vencer as dívidas.</p></div>

function form(f){ return Object.fromEntries(new FormData(f)); }
function addGasto(f){ const d = form(f); S.gastos.push({ id: uid(), nome: d.nome, valor: num(d.valor), cat: d.cat, data: d.data || hojeISO, atraso: !!d.atraso, original: d.atraso ? num(d.original) : 0 }); S.exemplo = false; salvar(); render(); toast('Gasto anotado'); }
function addFixa(f){ const d = form(f); S.fixas.push({ id: uid(), nome: d.nome, valor: num(d.valor), cat: d.cat, dia: +d.dia || null }); S.exemplo = false; salvar(); render(); toast('Conta adicionada'); }

function del(lista, id){ S[lista] = S[lista].filter(x => x.id !== id); salvar(); render(); }

// ===== Extrato bancário (OFX / CSV) =====
const REGRAS_CAT = [
  ['Alimentação', /mercad|supermerc|atacad|padaria|ifood|restaur|lanch|pizz|burger|a[cç]ougue|hortifr|assa[ií]|carrefour|extra |p[aã]o de a[cç]|rappi|food/i],
  ['Transporte', /uber|\b99|posto|combust|shell|ipiranga|petrobr|estacion|metr[oô]|[oô]nibus|bilhete|sem parar|pedagio|ped[aá]gio|cabify/i],
  ['Saúde', /farm|drog|raia|pacheco|hospital|cl[ií]nic|laborat|m[eé]dic|odont|unimed|amil/i],
  ['Contas', /energia|enel|cemig|light|copel|celesc|sabesp|cedae|copasa|saneam|[aá]gua|internet|vivo|claro|tim\b|oi\b|net\b|g[aá]s|comgas/i],
  ['Moradia', /aluguel|condom|imobili|iptu/i],
  ['Lazer', /netflix|spotify|disney|prime|hbo|globoplay|cinema|ingresso|bar\b|show|steam|playstation|xbox/i],
  ['Educação', /escola|curso|faculd|universid|livrar|udemy|alura/i],
  ['Compras', /shopee|amazon|mercado ?livre|magalu|magazine|americanas|shein|renner|riachuelo|c&a|loja/i],
];
const adivinhaCat = t => (REGRAS_CAT.find(([, re]) => re.test(t)) || ['Outros'])[0];
function parseValor(s){ s = String(s).replace(/[R$\s"]/g, ''); if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/,/g, ''); return +s; }
function parseData(s){ s = String(s).trim().replace(/"/g, ''); let m;
  if ((m = s.match(/^(\d{4})(\d{2})(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  if ((m = s.match(/^(\d{2})\/(\d{2})\/(\d{2,4})/))) return `${m[3].length === 2 ? '20' + m[3] : m[3]}-${m[2]}-${m[1]}`;
  return null; }
function lerOFX(t){
  return t.split(/<STMTTRN>/i).slice(1).map(b => {
    const tag = n => { const m = b.match(new RegExp('<' + n + '>([^<\\r\\n]*)', 'i')); return m ? m[1].trim() : ''; };
    return { data: parseData(tag('DTPOSTED')), nome: tag('MEMO') || tag('NAME') || 'Lançamento', valor: parseValor(tag('TRNAMT').replace(',', '.')) };
  });
}
function lerCSV(t){
  const linhas = t.replace(/^﻿/, '').split(/\r?\n/).filter(l => l.trim());
  if (linhas.length < 2) return [];
  const sep = (linhas[0].match(/;/g) || []).length > (linhas[0].match(/,/g) || []).length ? ';' : ',';
  const split = l => { const out = []; let cur = '', q = false; for (const ch of l){ if (ch === '"') q = !q; else if (ch === sep && !q){ out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out.map(s => s.trim()); };
  const head = split(linhas[0]).map(h => h.toLowerCase());
  const col = re => head.findIndex(h => re.test(h));
  const iD = col(/data|date/), iV = col(/valor|amount|value|quantia/), iN = col(/descri|title|t[ií]tulo|hist[oó]r|lan[cç]amento|estabelec|memo|identif/);
  if (iD < 0 || iV < 0) return [];
  const cartao = head.includes('title') && head.includes('amount');
  return linhas.slice(1).map(l => { const c = split(l); return { data: parseData(c[iD]), nome: (iN >= 0 ? c[iN] : 'Lançamento') || 'Lançamento', valor: parseValor(c[iV]) * (cartao ? -1 : 1) }; });
}
let EXT = [];
function lerExtrato(file){
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    const t = String(r.result);
    let lanc = /<OFX>|<STMTTRN>/i.test(t) ? lerOFX(t) : lerCSV(t);
    lanc = lanc.filter(l => l.data && isFinite(l.valor) && l.valor !== 0);
    const negs = lanc.filter(l => l.valor < 0).length;
    // despesas: valores negativos (extrato de conta). Se o arquivo só tem positivos, tratamos todos como despesas.
    const gastos = (negs ? lanc.filter(l => l.valor < 0) : lanc).map(l => ({ ...l, valor: Math.abs(l.valor), cat: adivinhaCat(l.nome) }));
    const ignora = /pagamento (de fatura|recebido)|transf.*(mesma titularidade|entre contas)|aplica[cç][aã]o|resgate/i;
    EXT = gastos.map((g, i) => ({ ...g, i, ok: !ignora.test(g.nome) && !S.gastos.some(x => x.data === g.data && Math.abs(num(x.valor) - g.valor) < .01 && x.nome === g.nome) }));
    mostraExtrato();
  };
  r.readAsText(file, /\.ofx$/i.test(file.name) ? 'ISO-8859-1' : 'UTF-8');
}
function mostraExtrato(){
  const out = $('#extRes');
  if (!EXT.length){ out.innerHTML = '<p class="hint">Não encontramos gastos nesse arquivo. Confira se é OFX ou CSV do extrato.</p>'; return; }
  const sel = EXT.filter(e => e.ok);
  out.innerHTML = `<div class="hint"><b>${EXT.length} gastos encontrados.</b> Desmarque o que não quer importar (transferências, pagamento de fatura) e ajuste a categoria.</div>
  <div class="list" style="max-height:380px;overflow:auto">${EXT.map(e => `<div class="item" style="grid-template-columns:auto 1fr auto"><input type="checkbox" aria-label="Importar" ${e.ok ? 'checked' : ''} onchange="EXT[${e.i}].ok=this.checked;mostraExtrato()" style="width:20px;height:20px;accent-color:var(--accent)"><div class="t"><b>${esc(e.nome)}</b><small>${e.data.split('-').reverse().join('/')}</small><select aria-label="Categoria" style="margin-top:4px;padding:6px 8px" onchange="EXT[${e.i}].cat=this.value">${CATS.map(c => `<option ${c === e.cat ? 'selected' : ''}>${c}</option>`).join('')}</select></div><span class="money">${brl(e.valor)}</span></div>`).join('')}</div>
  <button onclick="importaExtrato()">${ic('i-check')}Importar ${sel.length} gastos (${brl(sel.reduce((a, e) => a + e.valor, 0))})</button>`;
}
function importaExtrato(){ const sel = EXT.filter(e => e.ok); sel.forEach(e => S.gastos.push({ id: uid() + e.i, nome: e.nome, valor: e.valor, cat: e.cat, data: e.data })); EXT = []; S.exemplo = false; salvar(); render(); toast(`${sel.length} gastos importados`); }

function addDivida(f){

    <label for="orc">Quanto você consegue pagar por mês, somando todas as dívidas<small>Mínimo para não atrasar: ${brl(minimos)}.${temJuros ? ` Sugestão (mínimos + sobra do mês): ${brl(sugerido)}.` : ''}</small>
      <input id="orc" inputmode="decimal" value="${vf(orc)}" onchange="S.plano.orcamento=num(this.value);salvar();render()"></label>
  </div>
  ${!p.ok ? `<div class="status bad"><span class="tag bad">${ic('i-alert')}Precisa de ajuste</span><p>Com ${brl(orc)} por mês os juros crescem mais rápido do que você paga. Aumente o valor mensal ou renegocie para baixar os juros. Veja as dicas abaixo.</p></div>` : `
  <div class="status good"><span class="tag good">${ic('i-trophy')}Linha de chegada</span><span>Você vence todas as dívidas em</span><span class="big">${p.meses} ${p.meses === 1 ? 'mês' : 'meses'}</span><p>Seu último pagamento será em <b>${fim}</b>.${p.juros > 0 ? ` Juros até lá: <b>${brl(p.juros)}</b>.` : ''}${pMin.ok && pMin.meses > p.meses ? ` Pagando só os mínimos levaria ${pMin.meses} meses e ${brl(pMin.juros)} de juros. <b>Você economiza ${brl(pMin.juros - p.juros)}.</b>` : ''}</p></div>

  <div class="card chart"><h3><span class="ibox">${ic('i-down')}</span>Quanto você vai dever, mês a mês</h3>${linha(p.serie)}<p class="explain">A linha desce até zero: é o caminho até a vitória. Cada degrau mais forte é uma dívida a menos.</p></div>`}` : (S.dividas.length ? `<div class="status good"><span class="tag good">${ic('i-trophy')}Vitória</span><span class="big">Livre de dívidas!</span><p>Agora monte sua reserva de emergência com o valor que ia para as parcelas.</p></div>` : '')}
  <div class="card"><h3><span class="ibox">${ic('i-bulb')}</span>Dicas para negociar</h3>
    <details><summary>Antes de pagar, tente renegociar</summary><p>Bancos e lojas costumam dar descontos grandes para pagamento à vista ou parcelado sem juros, principalmente em dívidas atrasadas. Peça sempre o <b>CET</b> (Custo Efetivo Total) da proposta e compare.</p><p>Canais gratuitos: <a href="https://www.serasa.com.br/limpa-nome-online/" target="_blank" rel="noopener">Serasa Limpa Nome</a>, <a href="https://www.consumidor.gov.br" target="_blank" rel="noopener">consumidor.gov.br</a>, o app do seu banco e os mutirões do Procon do seu estado.</p></details>
    <details><summary>Saia do rotativo do cartão primeiro</summary><p>O rotativo é a dívida mais cara do país. Desde 2024 os juros e encargos do rotativo não podem passar de 100% do valor original da dívida, mas ainda pesam muito. Se possível, troque por um parcelamento ou consignado com juros menores.</p></details>
    <details><summary>Adiantar parcelas dá desconto</summary><p>Em empréstimos e financiamentos você tem direito a desconto dos juros ao pagar parcelas antecipadas (Código de Defesa do Consumidor, art. 52). Comece pelas últimas parcelas e peça o valor com desconto ao banco.</p></details>
    <details><summary>Lei do Superendividamento</summary><p>A Lei 14.181/2021 permite pedir uma renegociação conjunta de todas as dívidas de consumo, com um plano de até 5 anos, preservando o mínimo para você viver. Procure o Procon ou a Defensoria Pública da sua cidade.</p></details>
    <details><summary>Use o 13º e a restituição do IR</summary><p>Dinheiro extra que chega de uma vez é ideal para quitar a dívida mais cara ou negociar à vista com desconto.</p></details>
  </div>`;
};
function linha(serie){
  const W = 360, H = 210, pl = 58, pb = 28, pt = 12, pr = 14;
  const max = Math.max(...serie, 1), n = serie.length - 1 || 1;
  const x = i => pl + i / n * (W - pl - pr), y = v => pt + (1 - v / max) * (H - pt - pb);
  const pts = serie.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const ticks = [0, .5, 1].map(f => `<line x1="${pl}" x2="${W - pr}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="#E1EEE7"/><text x="${pl - 6}" y="${y(max * f) + 4}" text-anchor="end">${brl(max * f).replace(/,\d\d$/, '')}</text>`).join('');
  const passo = Math.max(1, Math.ceil(n / 4));
  const xt = serie.map((_, i) => i).filter(i => i % passo === 0 || i === n).filter(i => i === n || n - i >= passo * 0.8).map(i => `<text x="${x(i)}" y="${H - 8}" text-anchor="${i === n ? 'end' : i === 0 ? 'start' : 'middle'}">${i === 0 ? 'hoje' : curtoMes(somaMes(mesAtual, i - 1))}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo devedor ao longo dos meses">${ticks}${xt}
  <polygon points="${pl},${y(0)} ${pts} ${x(n)},${y(0)}" fill="#E2F5EB"/><polyline points="${pts}" fill="none" stroke="#138A5E" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="${x(0)}" cy="${y(serie[0])}" r="5" fill="#C2452F"/><circle cx="${x(n)}" cy="${y(serie[n])}" r="7" fill="#D9A21B" stroke="#fff" stroke-width="2"/></svg>`;
}

};
const PISO = ['SP', 'RJ', 'PR', 'SC', 'RS'];

  <div class="card"><label for="uf">Em que estado você mora?<select id="uf" onchange="S.uf=this.value;salvar();render()"><option value="">Escolha…</option>${Object.entries(UFS).map(([k, v]) => `<option value="${k}" ${k === S.uf ? 'selected' : ''}>${v[0]}</option>`).join('')}</select></label></div>
  ${u ? `<div class="grid2">
    <div class="card"><h3><span class="ibox">${ic('i-map')}</span>${u[0]} em números</h3><div class="tbl"><table>
      <tr><td><b>Salário mínimo nacional 2026</b><div class="explain">Ninguém com carteira assinada pode ganhar menos (jornada completa).</div></td><td class="n">${brl(1621)}</td></tr>
      <tr><td><b>Piso salarial estadual</b><div class="explain">${PISO.includes(S.uf) ? 'Seu estado tem piso próprio, maior que o mínimo nacional, para várias profissões. Confira o valor da sua categoria no site do governo estadual.' : 'Seu estado segue o salário mínimo nacional (ou o piso da convenção coletiva da sua categoria).'}</div></td><td class="n">${PISO.includes(S.uf) ? '<span class="tag good">Tem</span>' : '<span class="tag gray">Não tem</span>'}</td></tr>
      <tr><td><b>ICMS padrão</b><div class="explain">Imposto já incluído no preço da maioria dos produtos. Você não paga separado, mas ele encarece as compras.</div></td><td class="n">≈ ${u[1].toLocaleString('pt-BR')}%</td></tr>
      <tr><td><b>IPVA de carro</b><div class="explain">Pago uma vez por ano sobre o valor do veículo (tabela FIPE). Moto e carro elétrico costumam ter taxas diferentes.</div></td><td class="n">≈ ${u[2].toLocaleString('pt-BR')}%</td></tr>
    </table></div><p class="explain">Valores de referência de 2025/2026. Confirme na Secretaria da Fazenda (Sefaz) do seu estado, pois mudam por lei.</p></div>

  </div>
  <div class="card"><h3><span class="ibox">${ic('i-shield')}</span>Onde buscar ajuda em ${u[0]}</h3><ul style="margin:0;padding-left:20px;display:grid;gap:6px">
    <li><b>Procon ${S.uf}</b>: orienta e faz mutirões de renegociação de dívidas.</li>

    <li><a href="https://www.gov.br/receitafederal" target="_blank" rel="noopener">Receita Federal</a> e <a href="https://www.gov.br/inss" target="_blank" rel="noopener">Meu INSS</a>: impostos e contribuições.</li></ul></div>` : '<div class="empty">Escolha um estado para ver as regras e os impostos da sua região.</div>'}
  <div class="card"><h3><span class="ibox">${ic('i-doc')}</span>Tabelas usadas nos cálculos (2026)</h3>
    <details><summary>INSS do empregado</summary><div class="tbl"><table><tr><th>Salário</th><th class="n">Alíquota</th></tr>
      <tr><td>até R$ 1.621,00</td><td class="n">7,5%</td></tr><tr><td>de R$ 1.621,01 a R$ 2.902,84</td><td class="n">9%</td></tr><tr><td>de R$ 2.902,85 a R$ 4.354,27</td><td class="n">12%</td></tr><tr><td>de R$ 4.354,28 a R$ 8.475,55</td><td class="n">14%</td></tr></table></div>
      <p class="explain">É progressivo: cada alíquota vale só para a parte do salário dentro da faixa. Teto de contribuição: R$ 8.475,55. Fonte: Portaria Interministerial MPS/MF nº 13/2026.</p></details>
    <details><summary>Imposto de Renda (IRRF)</summary><div class="tbl"><table><tr><th>Base de cálculo</th><th class="n">Alíquota</th><th class="n">Dedução</th></tr>

V.ajuda = () => `
  <div class="head"><h2>Como usar</h2><p class="lead">Feito para qualquer pessoa usar. Siga os passos da tela Início e volte todo dia para anotar seus gastos.</p></div>
  <div class="card"><h3><span class="ibox">${ic('i-help')}</span>Perguntas comuns</h3>
    <details><summary>Meus dados ficam seguros?</summary><p>Sim. Tudo fica guardado só neste aparelho e neste navegador. Ninguém mais vê, nem quem te mandou o link. Se você trocar de celular ou limpar o navegador, use a cópia de segurança abaixo.</p></details>
    <details><summary>Como coloco na tela do celular, como um aplicativo?</summary><p><b>Android (Chrome):</b> abra o link, toque nos três pontinhos e em "Adicionar à tela inicial".</p><p><b>iPhone (Safari):</b> abra o link, toque no botão Compartilhar e em "Adicionar à Tela de Início".</p></details>
    <details><summary>Paguei uma conta atrasada. Como registro?</summary><p>Em <b>Gastos</b>, toque em "Marcar como paga" na conta, marque "Paguei com atraso" e coloque o valor que você pagou, já com juros e multa. Se não for uma conta fixa, anote como gasto do dia e marque "Era uma conta paga com atraso". O app mostra quanto o atraso custou.</p></details>
    <details><summary>Qual tipo de dívida eu escolho?</summary><p><b>Parcelada</b>: empréstimo, financiamento, carnê ou compra parcelada. Você informa em quantas vezes foi feita, o valor de cada parcela e quantas já pagou. Ela só entra nas contas nos meses em que ainda existe.</p><p><b>Cartão / cheque especial</b>: dívidas que crescem com juros sobre o saldo. Você informa quanto deve hoje e os juros ao mês.</p></details>
    <details><summary>Dá para puxar os gastos direto do banco?</summary><p>Você pode importar o extrato do banco (arquivo OFX ou CSV) na aba Gastos. A ligação automática com os bancos (Open Finance) depende de autorização e de um serviço pago, e ainda não está disponível.</p></details>
    <details><summary>O que é salário bruto e líquido?</summary><p><b>Bruto</b> é o valor do contrato. <b>Líquido</b> é o que cai na conta depois dos descontos (INSS, IR, vale-transporte etc.). Planeje sempre pelo líquido.</p></details>
    <details><summary>Qual regra seguir para organizar o dinheiro?</summary><p>Enquanto tiver dívidas: até <b>60%</b> para o essencial (moradia, comida, transporte, contas), pelo menos <b>20%</b> para quitar dívidas e o resto para lazer e imprevistos. Sem dívidas, troque os 20% por uma reserva de emergência.</p></details>
    <details><summary>Os cálculos substituem o RH ou um contador?</summary><p>Não. Eles são uma estimativa com as tabelas oficiais de 2026. Convenções coletivas, faltas, adicionais e regras da empresa podem mudar os valores. Em caso de dúvida, confira com o RH.</p></details>
  </div>
  <div class="card"><h3><span class="ibox">${ic('i-shield')}</span>Cópia de segurança</h3><p class="explain">Copie o código abaixo e guarde (no WhatsApp para você mesma, num e-mail ou num bloco de notas). Para restaurar, cole o código e toque em "Restaurar".</p>
    <div class="row"><button class="light" onclick="exportar()">Gerar código</button><button class="ghost" onclick="copiar()">Copiar</button></div>
    <textarea id="bkp" rows="4" placeholder="Seu código aparece aqui. Ou cole um código salvo para restaurar."></textarea>
    <div class="row"><button class="ghost" onclick="importar()">Restaurar</button>
      <label for="bkpFile" class="btn light" style="cursor:pointer">Abrir arquivo .json<input id="bkpFile" type="file" accept=".json,application/json,text/plain" hidden onchange="lerArquivo(this.files[0])"></label></div></div>
  <div class="card"><h3><span class="ibox bad">${ic('i-x')}</span>Apagar tudo</h3><p class="explain">Remove todos os dados deste aparelho e começa do zero.</p>
    <div class="row" id="apagarBox"><button class="danger" onclick="$('#apagarBox').innerHTML='<span>Tem certeza? Não dá para desfazer.</span><button class=danger onclick=limparTudo()>Sim, apagar</button><button class=ghost onclick=render()>Cancelar</button>'">Apagar meus dados</button></div></div>`;
function exportar(){ $('#bkp').value = JSON.stringify(S); toast('Código gerado'); }
async function copiar(){ const t = $('#bkp'); if (!t.value) exportar(); try { await navigator.clipboard.writeText(t.value); toast('Copiado'); } catch (e) { t.select(); toast('Selecionado. Use Copiar do celular.'); } }
function importar(){ try { const d = JSON.parse($('#bkp').value); if (!d.folha) throw 0; S = { ...structuredClone(VAZIO), ...d }; salvar(); render(); toast('Dados restaurados'); } catch (e) { toast('Código inválido. Confira se copiou inteiro.'); } }
function lerArquivo(f){ if (!f) return; const r = new FileReader(); r.onload = () => { $('#bkp').value = r.result; importar(); }; r.readAsText(f); }
function limparTudo(){ S = structuredClone(VAZIO); salvar(); location.hash = '#salario'; render(); toast('Pronto! Comece pelo seu salário.'); }

// ===== Navegação =====
function render(){
  const v = (location.hash || '#inicio').slice(1);
  const nome = V[v] ? v : 'inicio';
  const det = [...document.querySelectorAll('#main details')].map(d => d.open);
  $('#main').innerHTML = `<section class="view">${V[nome]()}</section>`;
  if (render.ult === nome) document.querySelectorAll('#main details').forEach((d, i) => { if (det[i]) d.open = true; });
  render.ult = nome;
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.v === nome));
  atualizarTopo();
}
addEventListener('hashchange', () => { render(); scrollTo(0, 0); });
render();
</script>
